<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c5364"/>
      <stop offset="100%" stop-color="#0f2027"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="110" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="110" fill="url(#bg)"/>
    <g opacity="0.16" fill="#ffffff">
      <path d="M0 45 Q 75 20 150 45 T 300 45 T 450 45 T 600 45 T 750 45 T 900 45 T 1050 45 T 1200 45 V110 H0Z">
        <animateTransform attributeName="transform" type="translate" from="-300 0" to="0 0" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.14" fill="#ff9900">
      <path d="M0 62 Q 100 38 200 62 T 400 62 T 600 62 T 800 62 T 1000 62 T 1200 62 V110 H0Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  <text x="450" y="70" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#e6edf3">
    Thanks for stopping by ☁️ Let's build something great.
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
