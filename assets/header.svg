<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#36bcf7"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="170" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="170" fill="url(#bg)"/>
    <!-- animated waves -->
    <g opacity="0.18" fill="#ffffff">
      <path d="M0 140 Q 75 120 150 140 T 300 140 T 450 140 T 600 140 T 750 140 T 900 140 T 1050 140 T 1200 140 V170 H0Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.12" fill="#ff9900">
      <path d="M0 150 Q 100 128 200 150 T 400 150 T 600 150 T 800 150 T 1000 150 T 1200 150 V170 H0Z">
        <animateTransform attributeName="transform" type="translate" from="-400 0" to="0 0" dur="11s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- floating dots -->
    <g fill="#36bcf7" opacity="0.5">
      <circle cx="780" cy="40" r="3"><animate attributeName="cy" values="40;25;40" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="80" r="2"><animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="730" cy="95" r="2.5"><animate attributeName="cy" values="95;75;95" dur="6s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- name -->
  <text x="450" y="70" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="url(#name)">Salah Said
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- cycling lines -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#e6edf3" text-anchor="middle">
    <text x="450" y="108" opacity="1">Cloud &amp; DevOps Engineer
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.22;0.25;1" values="1;1;0;0"/>
    </text>
    <text x="450" y="108" opacity="0">AWS Certified Solutions Architect – Associate
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.28;0.47;0.5;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="450" y="108" opacity="0">Terraform • Docker • GitHub Actions
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.5;0.53;0.72;0.75;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="450" y="108" opacity="0">I automate, I secure, I ship.
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.75;0.78;1" values="0;0;1;1"/>
    </text>
  </g>
  <!-- blinking cursor line -->
  <rect x="300" y="120" width="300" height="2" rx="1" fill="#ff9900" opacity="0.8">
    <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.4;0.9;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="450;300;300;450" keyTimes="0;0.4;0.9;1" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
