<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9900"><animate attributeName="stop-color" values="#ff9900;#36bcf7;#ff9900" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#36bcf7"><animate attributeName="stop-color" values="#36bcf7;#ff9900;#36bcf7" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="900" height="230" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="230" fill="url(#bg)"/>
    <rect width="900" height="230" fill="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
    </rect>
    <!-- grid -->
    <g stroke="#ffffff" stroke-opacity="0.04">
      <path d="M0 40H900M0 80H900M0 120H900M0 160H900M0 200H900"/>
      <path d="M100 0V230M200 0V230M300 0V230M400 0V230M500 0V230M600 0V230M700 0V230M800 0V230"/>
    </g>
    <!-- waves -->
    <g opacity="0.16" fill="#ffffff">
      <path d="M0 195 Q 75 170 150 195 T 300 195 T 450 195 T 600 195 T 750 195 T 900 195 T 1050 195 T 1200 195 V230 H0Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.14" fill="#ff9900">
      <path d="M0 205 Q 100 182 200 205 T 400 205 T 600 205 T 800 205 T 1000 205 T 1200 205 V230 H0Z">
        <animateTransform attributeName="transform" type="translate" from="-400 0" to="0 0" dur="11s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- floating dots -->
    <g fill="#36bcf7" opacity="0.55">
      <circle cx="90" cy="60" r="3"><animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="130" r="2"><animate attributeName="cy" values="130;110;130" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="810" cy="50" r="3"><animate attributeName="cy" values="50;30;50" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="140" r="2.5"><animate attributeName="cy" values="140;118;140" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="110" r="2"><animate attributeName="cy" values="110;92;110" dur="5.5s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- greeting -->
  <text x="450" y="52" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#8b949e">
    &lt;Hi&gt; 👋 I'm
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>
  <!-- name -->
  <text x="450" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="url(#name)">Salah Said
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
  </text>

  <!-- cycling lines -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="21" fill="#e6edf3" text-anchor="middle">
    <text x="450" y="152" opacity="1">☁️ Cloud &amp; DevOps Engineer
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.18;0.2;1" values="1;1;0;0"/>
    </text>
    <text x="450" y="152" opacity="0">🏆 AWS Certified Solutions Architect – Associate
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.2;0.22;0.38;0.4;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="450" y="152" opacity="0">🏗️ Terraform • Bash • Python
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.4;0.42;0.58;0.6;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="450" y="152" opacity="0">🐳 Docker • GitHub Actions • CI/CD
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.6;0.62;0.78;0.8;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="450" y="152" opacity="0">🚀 I automate, I secure, I ship.
      <animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.8;0.82;1" values="0;0;1;1"/>
    </text>
  </g>
  <!-- animated underline -->
  <rect x="300" y="168" width="300" height="3" rx="1.5" fill="#ff9900" opacity="0.85">
    <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.4;0.9;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="450;300;300;450" keyTimes="0;0.4;0.9;1" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
